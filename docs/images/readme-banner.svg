<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Watch It</title>
  <desc id="description">A mint play button on a dark teal background. Pick a video. Press play. Flutter video player project.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1829" />
      <stop offset="1" stop-color="#104c4a" />
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8fff0" />
      <stop offset="1" stop-color="#4ddcc5" />
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)" />
  <circle cx="1090" cy="30" r="215" fill="#67ead2" opacity="0.05" />
  <circle cx="1090" cy="30" r="155" fill="none" stroke="#67ead2" stroke-opacity="0.12" />
  <circle cx="60" cy="390" r="160" fill="#67ead2" opacity="0.05" />
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="64" y="53" width="247" height="30" rx="15" fill="#a5f3e0" fill-opacity="0.1" />
    <text x="84" y="73" fill="#a5f3e0" font-size="12" font-weight="700" letter-spacing="2">FLUTTER · VIDEO PLAYER</text>
    <text x="60" y="167" fill="#ffffff" font-size="76" font-weight="750" letter-spacing="-3">Watch It<tspan fill="#7aefd7">.</tspan></text>
    <text x="64" y="218" fill="#d6f3ed" font-size="27">Pick a video. Press play.</text>
    <text x="64" y="293" fill="#9bbebc" font-size="15" letter-spacing="1">A CS ACADEMY TRAINING PROJECT</text>
  </g>
  <g transform="translate(820 58)">
    <rect x="16" y="16" width="290" height="228" rx="24" fill="#050e1b" opacity="0.3" />
    <rect width="290" height="228" rx="24" fill="#183e47" stroke="#a5f3e0" stroke-opacity="0.25" />
    <circle cx="145" cy="99" r="58" fill="url(#mint)" />
    <path d="M132 73 L132 125 L172 99 Z" fill="#12373e" />
    <rect x="30" y="181" width="230" height="5" rx="2.5" fill="#335a60" />
    <rect x="30" y="181" width="144" height="5" rx="2.5" fill="#7aefd7" />
    <circle cx="174" cy="183.5" r="6" fill="#c2fff1" />
